<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5ebde"><meta name="description" content="Una semilla, un árbol de girasoles y todo mi amor para ti.">
<title>Para ti, mi amor 🌻</title>
<style>
:root{color-scheme:light;--paper:#f5ebde;--ink:#594638;--gold:#bf8b32;--red:#a4464e}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#eee2d2;color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:grid;place-items:center;padding:24px}button{font:inherit;cursor:pointer}main{width:min(1080px,100%);background:var(--paper);border:1px solid #fff8;box-shadow:0 24px 80px #62432716;border-radius:28px;overflow:hidden;position:relative}.scene{position:relative;height:640px}canvas{width:100%;height:100%;display:block}.letter{position:absolute;top:118px;left:6.5%;width:33%;opacity:0;transform:translateY(10px);transition:opacity 1.8s,transform 1.8s}.letter.visible{opacity:1;transform:none}.eyebrow{font:11px/1.5 system-ui,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#9d7a4e}h1{font-weight:normal;font-size:clamp(28px,3.2vw,38px);line-height:1.2;margin:15px 0 22px}#message{font-size:19px;line-height:1.85;min-height:155px;white-space:pre-line}#message::after{content:'|';animation:blink 1s steps(1) infinite;color:var(--gold)}#message.done::after{display:none}.signature{font-style:italic;color:var(--red);margin-top:20px;opacity:0;transition:opacity 1s}.signature.visible{opacity:1}.counter{position:relative;margin:0 6.5% 24px;border-top:1px solid #bea98a;padding-top:18px;opacity:0;transition:opacity 1.5s}.counter.visible{opacity:1}.counter-label{font-size:14px;margin:0 0 10px}.calendar{font-size:20px;margin-bottom:10px}.units{display:flex;align-items:baseline;gap:17px;flex-wrap:wrap;font:13px system-ui,sans-serif;color:#8b725b}.units strong{font-size:25px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}.date{font:11px system-ui,sans-serif;letter-spacing:1px;margin-top:14px;color:#987e67}.controls{display:flex;justify-content:space-between;align-items:center;padding:0 6.5% 22px;font-size:12px;color:#9d856b}#replay{border:0;background:transparent;color:#846f57;padding:10px;opacity:0;transition:opacity 1s}#replay.visible{opacity:1}.intro{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--paper);transition:opacity .7s,visibility .7s}.intro.hidden{opacity:0;visibility:hidden;pointer-events:none}.intro p{font-size:15px;color:#977a60;margin:24px 0 0}.open{background:transparent;border:0;padding:25px;color:var(--red);display:flex;align-items:center;flex-direction:column;gap:23px}.heart{width:48px;height:48px;background:var(--red);transform:rotate(-45deg);position:relative;box-shadow:-8px 8px 35px #a4464e18;animation:pulse 2s ease-in-out infinite}.heart:before,.heart:after{content:'';position:absolute;width:48px;height:48px;background:var(--red);border-radius:50%}.heart:before{top:-24px;left:0}.heart:after{left:24px;top:0}.open span:last-child{font-size:17px;margin-top:12px}.open:focus-visible,#replay:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:8px}@keyframes pulse{50%{transform:rotate(-45deg) scale(1.08)}}@keyframes blink{50%{opacity:0}}@media(max-width:650px){body{padding:12px;display:block}main{border-radius:22px;margin:auto;max-width:480px}.scene{height:auto;display:flex;flex-direction:column}canvas{height:430px;order:1}.letter{position:relative;left:auto;top:auto;width:auto;margin:27px 30px 0;order:2;display:none}.letter.visible{display:block}h1{font-size:30px;margin:9px 0 14px}#message{font-size:17px;line-height:1.7;min-height:145px}.signature{margin:12px 0 24px}.counter{margin:20px 30px}.calendar{font-size:19px}.units{gap:11px}.units strong{font-size:22px}.controls{padding:0 30px 15px}.intro{min-height:510px}main:has(.intro:not(.hidden)){min-height:600px}}@media(prefers-reduced-motion:reduce){.heart{animation:none}#message::after{animation:none}}
</style></head>
<body><main aria-label="Una sorpresa de amor">
<div class="intro" id="intro"><div class="eyebrow">Un pequeño regalo para ti</div><button class="open" id="open" aria-label="Abrir mi sorpresa"><span class="heart" aria-hidden="true"></span><span>Toca para abrir</span></button><p>De Edwin, con todo mi amor.</p></div>
<div class="scene"><canvas id="garden" role="img" aria-label="Una semilla crece hasta convertirse en un árbol de girasoles. Dos pingüinos se encuentran y se abrazan debajo de él."></canvas><section class="letter" id="letter"><div class="eyebrow">Para el amor de mi vida</div><h1>Contigo, todo florece.</h1><div id="message" aria-label="Te amo, mi amor. Gracias por este año y dos meses juntos. Eres lo más lindo que me ha pasado en la vida. Te amo. ❤️"></div><p class="signature" id="signature">Siempre tú y yo.<br>Con amor, Edwin.</p></section></div>
<section class="counter" id="counter" aria-label="Tiempo que llevamos juntos"><p class="counter-label">Nuestra historia comenzó hace…</p><div class="calendar" id="calendar"></div><div class="units"><span><strong id="days">0</strong> días</span><span><strong id="hours">00</strong> horas</span><span><strong id="minutes">00</strong> minutos</span><span><strong id="seconds">00</strong> segundos</span></div><div class="date">DESDE EL 5 DE AGOSTO DE 2025 · CADA SEGUNDO CONTIGO</div></section>
<footer class="controls"><span>Una semilla. Nuestro amor. 🌻</span><button id="replay" aria-label="Volver a ver la animación">Volver a ver ↻</button></footer>
</main><script>
'use strict';
const canvas=document.getElementById('garden'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id),clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)};
const START=Date.parse('2025-08-05T00:00:00-06:00');
function clock(now=Date.now()){
 const seconds=Math.max(0,Math.floor((now-START)/1000));
 $('days').textContent=Math.floor(seconds/86400);$('hours').textContent=String(Math.floor(seconds/3600)%24).padStart(2,'0');$('minutes').textContent=String(Math.floor(seconds/60)%60).padStart(2,'0');$('seconds').textContent=String(seconds%60).padStart(2,'0');
 const d=new Date(now-6*3600000);let months=(d.getUTCFullYear()-2025)*12+d.getUTCMonth()-7;if(d.getUTCDate()<5)months--;months=Math.max(0,months);let years=Math.floor(months/12),m=months%12;
 $('calendar').textContent=[years?`${years} ${years===1?'año':'años'}`:'',m?`${m} ${m===1?'mes':'meses'}`:''].filter(Boolean).join(' y ')+' juntos ♥';
}clock();setInterval(clock,1000);
let rng=143;function rand(){rng=(rng*1664525+1013904223)>>>0;return rng/4294967296}
const flowers=[];for(let i=0;i<620;i++){let x,y;do{x=(rand()*2-1)*1.1;y=rand()*2-1}while((x*x+y*y-1)**3-x*x*y*y*y>0);flowers.push({x:x*152,y:-y*145,size:5+rand()*5,angle:rand()*Math.PI,delay:rand()*5.1,tone:rand()})}flowers.sort((a,b)=>a.delay-b.delay);
const branches=[];function branch(x,y,len,angle,depth,delay){const ex=x+Math.sin(angle)*len,ey=y-Math.cos(angle)*len;branches.push({x,y,ex,ey,width:depth*1.5,delay});if(depth>1){branch(ex,ey,len*.71,angle-.42-rand()*.18,depth-1,delay+.32);branch(ex,ey,len*.72,angle+.4+rand()*.18,depth-1,delay+.36)}}branch(0,0,100,0,6,0);
function sunflower(x,y,r,angle,tone){ctx.save();ctx.translate(x,y);ctx.rotate(angle);for(let i=0;i<11;i++){ctx.rotate(Math.PI*2/11);ctx.fillStyle=tone>.5?'#f4bd3f':'#eaa52d';ctx.beginPath();ctx.ellipse(0,-r*.74,r*.28,r*.6,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#70492c';ctx.beginPath();ctx.arc(0,0,r*.43,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ad7b3e';for(let i=0;i<5;i++){let a=i*2.4;ctx.beginPath();ctx.arc(Math.cos(a)*r*.2,Math.sin(a)*r*.2,r*.065,0,7);ctx.fill()}ctx.restore()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function penguin(x,y,facing,walk,hug,rose){ctx.save();ctx.translate(x,y);ctx.scale(facing,1);ctx.rotate(walk*.045);ellipse(0,4,28,5,'#62432715');ellipse(-10,0,11,5,'#d69542');ellipse(11,0,11,5,'#d69542');ellipse(0,-32,23,34,'#28333d');ellipse(2,-27,17,26,'#fff8ee');ellipse(2,-60,22,23,'#28333d');ellipse(-5,-59,9,13,'#fff8ee');ellipse(10,-59,10,13,'#fff8ee');ellipse(-4,-62,2,3,'#27313b');ellipse(11,-62,2,3,'#27313b');ellipse(0,-53,4,2,'#efb5a1');ellipse(17,-53,4,2,'#efb5a1');ctx.fillStyle='#dba046';ctx.beginPath();ctx.moveTo(3,-57);ctx.lineTo(16,-53);ctx.lineTo(4,-50);ctx.fill();ctx.save();ctx.translate(-17,-38);ctx.rotate(-.35-walk*.12);ellipse(0,10,6,20,'#28333d');ctx.restore();ctx.save();ctx.translate(18,-39);ctx.rotate(-.4-hug*1.1+walk*.1*(1-hug));ellipse(0,11,6,21,'#354451');ctx.restore();ctx.fillStyle=rose?'#b96971':'#839980';ctx.fillRect(-19,-46,37,6);ctx.save();ctx.translate(-12,-43);ctx.rotate(.15);ctx.fillRect(-3,0,6,17);ctx.restore();ctx.restore()}
let start=0,running=false,raf=0,W=1000,H=640,mobile=false;
function resize(){const rect=canvas.getBoundingClientRect();mobile=rect.width<=650;W=mobile?480:1000;H=mobile?560:640;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}
new ResizeObserver(resize).observe(canvas);
const message='Te amo, mi amor.\nGracias por este año y dos meses juntos.\nEres lo más lindo que me ha pasado en la vida.\nTe amo. ❤️';const chars=Array.from(message);
function frame(now){if(!running)return;let t=(now-start)/1000;ctx.clearRect(0,0,W,H);const ground=H-68,shift=ease((t-10)/2),cx=mobile?W/2:W/2+190*shift;
 // The seed falls first; the ground line opens beneath it.
 ctx.strokeStyle='#a18a70';ctx.lineWidth=1.2;ctx.beginPath();let line=ease((t-.4)/1.3);ctx.moveTo(cx-(W*.42)*line,ground);ctx.lineTo(cx+(W*.42)*line,ground);ctx.stroke();
 if(t<2.35){let fall=ease((t-.5)/1.55),y=H*.28+(ground-H*.28)*fall;ctx.save();ctx.translate(cx,y-5);ctx.rotate(fall*3);ellipse(0,0,3.5,6,'#754a30');ctx.restore()}
 ctx.save();ctx.translate(cx,ground);let growth=t-2;for(const b of branches){let p=ease((growth-b.delay)/1.25);if(!p)continue;ctx.strokeStyle=b.width>5?'#54775c':'#71885a';ctx.lineWidth=b.width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+(b.ex-b.x)*p,b.y+(b.ey-b.y)*p);ctx.stroke()}
 for(const f of flowers){let p=ease((t-5-f.delay)/.8);if(p>0)sunflower(f.x,f.y-305,f.size*p,f.angle+Math.sin(t*.7+f.x)*.025,f.tone)}ctx.restore();
 // No penguin enters until the final sunflower has blossomed (10.9s).
 if(t>11.2){let meet=ease((t-11.2)/5),hug=ease((t-16.2)/1.5),lx=-40+(cx-19+40)*meet,rx=W+40+(cx+19-W-40)*meet;let step=Math.sin(t*10)*(1-meet);penguin(lx,ground-Math.abs(step)*4,1,step,hug,false);penguin(rx,ground-Math.abs(step)*4,-1,-step,hug,true);if(hug>0){ctx.save();ctx.globalAlpha=hug;ctx.fillStyle='#a4464e';ctx.font='24px Georgia';ctx.textAlign='center';ctx.fillText('♥',cx,ground-102-Math.sin(t*1.5)*3);ctx.restore()}}
 if(t>17.4){$('letter').classList.add('visible');$('counter').classList.add('visible');const count=Math.min(chars.length,Math.floor((t-18)*24));$('message').textContent=chars.slice(0,Math.max(0,count)).join('');if(count===chars.length){$('message').classList.add('done');$('signature').classList.add('visible');$('replay').classList.add('visible')}}
 // A few sunflower petals drift down, as in the original heart-leaf video.
 if(t>12)for(let i=0;i<5;i++){let p=((t*.045+i*.21)%1),x=cx+Math.sin(i*2+t*.4)*130+(p*40),y=ground-340+p*330;ctx.save();ctx.globalAlpha=.45*Math.sin(p*Math.PI);ctx.translate(x,y);ctx.rotate(t*.7+i);ellipse(0,0,3,6,'#e6ad39');ctx.restore()}
 raf=requestAnimationFrame(frame)}
function play(){cancelAnimationFrame(raf);$('intro').classList.add('hidden');for(const id of ['letter','counter','signature','replay'])$(id).classList.remove('visible');$('message').textContent='';$('message').classList.remove('done');resize();start=performance.now();running=true;raf=requestAnimationFrame(frame)}
$('open').addEventListener('click',play);$('replay').addEventListener('click',play);
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else if(running)raf=requestAnimationFrame(frame)});
</script></body></html>
